<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>USBWatch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='7' y='2' width='10' height='9' rx='1' fill='%233b82f6'/%3E%3Crect x='4' y='10' width='16' height='12' rx='3' fill='%233b82f6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <h1>USBWatch</h1>
      <p class="muted">Sign in to the local console</p>
      <label class="field">User<input id="login-user" name="username" autocomplete="username" value="admin" required></label>
      <label class="field">Password<input id="login-pw" name="password" type="password" autocomplete="current-password" required></label>
      <div id="login-msg" class="err" role="alert"></div>
      <button class="btn primary wide" type="submit">Sign in</button>
      <p class="muted small">Forgot it? On this computer run <span class="mono">sudo usbwatch passwd</span></p>
    </form>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="side">
      <div class="brand">USBWatch<small>USB drive activity</small></div>
      <nav id="nav">
        <a href="#/overview" data-page="overview">Overview</a>
        <a href="#/drives" data-page="drives">USB drives</a>
        <a href="#/activity" data-page="activity">Activity</a>
        <a href="#/settings" data-page="settings">Settings</a>
      </nav>
      <div class="side-foot">
        <div id="side-status" class="muted small"></div>
        <button id="logout" class="btn ghost small">Sign out</button>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card"><div id="modal-body"></div>
      <div class="row end"><button class="btn ghost" id="modal-no">Cancel</button><button class="btn" id="modal-yes">OK</button></div>
    </div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
