# USBWatch for Linux - /etc/usbwatch/usbwatch.conf
# Owned by root, readable by group usbwatch. Restart both services after editing:
#   systemd: sudo systemctl restart usbwatch usbwatch-web
#   OpenRC : sudo rc-service usbwatch restart; sudo rc-service usbwatch-web restart
#   SysV   : sudo service usbwatch restart; sudo service usbwatch-web restart
#
# Day-to-day settings (policy mode, whitelist/blacklist, vault, hashing, read logging, retention) are
# changed in the web console. This file only holds paths, logging and how far the console is exposed.

[paths]
data_dir = /var/lib/usbwatch
log_dir = /var/log/usbwatch

[web]
enabled = yes
# Address(es) to listen on, comma separated. Default: this computer only.
# Examples:  127.0.0.1, ::1        (local only, IPv4 + IPv6)
#            0.0.0.0               (all IPv4 interfaces - then restrict with 'allow' below!)
#            192.168.1.20          (one interface)
bind = 127.0.0.1
port = 8790
# Client addresses / networks allowed to connect (connections from anything else are dropped before
# any HTTP is processed). Loopback is always allowed. Use 'any' to allow everyone (not recommended).
#   allow = 127.0.0.1, ::1, 192.168.1.0/24, 10.0.0.5
allow = 127.0.0.1, ::1
# Extra host names the browser may use to reach the console (DNS-rebinding protection), e.g.
#   allowed_hosts = usbwatch.lab.local, 192.168.1.20
allowed_hosts =
# HTTPS: strongly recommended whenever the console is reachable from other machines.
# Files must be readable by group usbwatch (chgrp usbwatch key.pem; chmod 640 key.pem).
#   Self-signed example:
#   openssl req -x509 -newkey rsa:3072 -nodes -days 3650 -subj /CN=usbwatch \
#     -keyout /etc/usbwatch/tls.key -out /etc/usbwatch/tls.crt
tls_cert =
tls_key =
# Sign-in session expires after this many hours of inactivity.
session_hours = 8
# Failed sign-ins per client address within 10 minutes before lock-out.
max_failed_logins = 10

[monitor]
# Fallback polling interval in seconds (netlink uevents wake the service instantly anyway).
poll_interval = 1.0
# Name the process and user behind reads/writes on USB drives (fanotify; needs root).
process_attribution = yes
# Upper bound of inotify watches (folders) per USB drive.
max_watches = 200000
# Folder / file names never reported (shell-style patterns).
skip_dirs = System Volume Information, $RECYCLE.BIN, lost+found, .Trash-*, .Spotlight-V100, .fseventsd

[logging]
# debug | info | warning | error
level = info
# Every event is also appended here as one JSON object per line (for SIEM / log shippers). Empty = off.
events_file = /var/log/usbwatch/events.jsonl
# Also send every event to the local syslog (facility auth). yes / no
syslog = no
